name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linting tools
        run: pip install ruff
      - name: Run ruff linter
        working-directory: backend
        run: ruff check .
      - name: Run ruff formatter check
        working-directory: backend
        run: ruff format --check .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paperless_test
          POSTGRES_USER: paperless
          POSTGRES_PASSWORD: paperless
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django checks
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: "1"
          DJANGO_ALLOWED_HOSTS: "localhost"
          DATABASE_URL: "postgres://paperless:paperless@localhost:5432/paperless_test"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python manage.py check
      - name: Run migrations
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: "1"
          DJANGO_ALLOWED_HOSTS: "localhost"
          DATABASE_URL: "postgres://paperless:paperless@localhost:5432/paperless_test"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python manage.py migrate
      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: "1"
          DJANGO_ALLOWED_HOSTS: "localhost"
          DATABASE_URL: "postgres://paperless:paperless@localhost:5432/paperless_test"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python manage.py test core.tests --verbosity=2

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint || true  # Don't fail on lint warnings for now

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t paperless-backend ./backend
      - name: Build worker image
        run: docker build -t paperless-worker -f ./backend/worker.Dockerfile ./backend
